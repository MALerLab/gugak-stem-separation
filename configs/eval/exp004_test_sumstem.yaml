# eval-job config — exp004 ep58 (HTDemucs partial-coherent, best HTDemucs), TEST,
# Σstem. Persists preds (the second "best model" whose audio we keep).
#
# Run:
#   uv run python -m src.eval.runner --config configs/eval/exp004_test_sumstem.yaml

run_id: eval_exp004_ep58_test_sumstem

checkpoint: experiments/exp004_260815_coherent_p1_uniform/checkpoints/model_htdemucs_ep_58_si_sdr_6.7004.ckpt
model_config: configs/exp004_htdemucs_coherent_p1_uniform.yaml
model_type: htdemucs

targets:
  - {split: test, variant: sumstem}

metrics: [si_sdr, usdr]
usdr_eps: 1.0e-7
metric_cap_db: 100.0
silence_config: configs/silence.yaml
eval_manifest: manifests/parquet/eval_manifest.parquet
out_dir: experiments/exp004_260815_coherent_p1_uniform/eval
seed: 42
device: cuda:2

render:
  enabled: true
  songs: all
  preds_only: true
  out_dir: experiments/exp004_260815_coherent_p1_uniform/eval_renders
