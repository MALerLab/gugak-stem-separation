# eval-job config — exp003.0_ep59, TEST split, MASTER variant, master ALIGNED to its stems via
# the master_lag table (scripts/master_lag_scan.py; 19/135 test masters carry a fixed
# sample offset that collapses sample-wise metrics). Otherwise identical to the
# unaligned exp003.0_ep59 master run: same metrics / silence / aggregation, rows only.
#
# Run:
#   uv run python -m src.eval.runner --config configs/eval/exp003.0_ep59_test_master_aligned.yaml

run_id: eval_exp003.0_ep59_test_master_aligned

checkpoint: experiments/exp003.0_260809_bsroformer_pilot/checkpoints/model_bs_roformer_ep_59_si_sdr_10.7013.ckpt
model_config: configs/exp003.0_bsroformer_pilot.yaml
model_type: bs_roformer

targets:
  - {split: test, variant: master}

metrics: [si_sdr, usdr]
usdr_eps: 1.0e-7
metric_cap_db: 100.0
silence_config: configs/silence.yaml
eval_manifest: manifests/parquet/eval_manifest.parquet
master_lag_table: manifests/parquet/master_lag.parquet
out_dir: experiments/exp003.0_260809_bsroformer_pilot/eval
seed: 42
device: cuda:0

render:
  enabled: false
  songs: []
  out_dir: null
