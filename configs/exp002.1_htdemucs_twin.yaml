# exp002.1_htdemucs_twin.yaml — the SEED TWIN of exp002. One config = one wandb run
# (exp002.1_260806_twin).
#
# WHY THIS RUN EXISTS. Two questions, one run.
#
#   1. THE INIT LOTTERY (the primary reason). HTDemucs has no per-source subnetworks:
#      every layer is shared, and the sources diverge only at the final conv of each
#      decoder, which emits n_sources × audio_channels channels that get reshaped into
#      per-source slices. Our nine "heads" are therefore nine thin projections reading
#      one shared feature space — and they were randomly initialized when the pretrained
#      4-source output layer was reshaped to 9. So which slice claims which acoustic
#      content may be partly an accident of where each slice started, amplified by
#      rich-get-richer dynamics. exp001's most confusing result — 가야금 at −5.9 dB
#      despite being the second most abundant class, while 거문고 sits at +1.5 — reads
#      very differently depending on the answer:
#        · 가야금 poor in BOTH arms by a similar margin → intrinsic to instrument + data;
#          stop investigating init, look at register overlap and unison instead.
#        · 가야금 poor in ONE arm only → assignment stochasticity is real, and the
#          warm-start ablation (exp002.2) becomes the interesting follow-up.
#   2. THE NOISE FLOOR (by-product). exp001.1 measured epoch-to-epoch val swing at
#      ~±0.5–1.4 dB, which makes any experiment-to-experiment claim below ~1 dB
#      unreadable today. A matched pair gives a run-to-run range for the first time.
#
# DERIVED FROM exp002 (configs/exp002_htdemucs_v2_uniform_n.yaml), verified field-by-field
# against the config actually logged in exp002's wandb transaction log
# (offline-run-20260805_095738-476pciph) rather than reconstructed — the same discipline
# exp001.1 used, and the exact failure mode that nearly bit it.
#
# EXACTLY ONE THING CHANGES: the seed. It is three surfaces of one knob, and all three
# move together to 43 (exp002 = 42; arm index increments the base, leaving 44 for
# exp002.2):
#   1. gugak_mix.seed below                        — the incoherent-mix draw stream
#   2. --seed on the trainer          (launch.sh)  — torch/numpy global, data order
#   3. --seed on init_start_checkpoint.py          — the fresh init of the 9 output heads
# Surface 3 is the load-bearing one for question 1: reusing exp002's start_checkpoint
# would give both arms bit-identical heads and leave the init lottery untested.
#
# ⚠️ CAVEAT, DELIBERATE, DO NOT "FIX". Moving the seed moves BOTH data order and weight
# initialization, so this strictly measures run-to-run stochasticity, not initialization
# specifically. That is the intended scope for this pass — if 가야금 does move between
# arms, isolating which of the two caused it is a cheap follow-up.
#
# Everything else — manifest v2, density_mode uniform, lr 1e-4, bf16, the 9-class scheme,
# the whole architecture block — is exp002's, unchanged, and asserted so mechanically.
#
# Structure: MSST sections (audio/training/augmentations/inference/model/htdemucs)
# consumed by external/msst train.py, + our own blocks (gugak_mix = the incoherent-mix
# dataloader, sumstem_eval = the Σstem val renderer). Loss/metrics are CLI flags:
# --loss l1_loss --metrics si_sdr --metric_for_scheduler si_sdr (→ launch script).

# --- MSST: audio geometry ---
audio:
  chunk_size: 441000        # 10 s × 44100 — the checkpoint's native training length
  min_mean_abs: 0.0         # unused: our dataset does activity-aware draws itself
  hop_length: 1024

# --- MSST: training ---
training:
  run_name: exp002.1_260806_twin    # [exp002.1] run-scoped, not a substantive difference
  custom_dataset: "src.data.mix_dataset:create_msst_dataset"   # fork hook → our loader
  batch_size: 8                     # physical, per spec (× accum 4 → effective 32)
  gradient_accumulation_steps: 4
  grad_clip: 5.0                    # HTDemucs ft recipe (L2 norm)
  segment: 10
  shift: 1
  samplerate: 44100
  channels: 2
  normalize: false                  # normalization owned by the dataset (−19 LUFS tuple)
  instruments: [가야금, 거문고, 기타, 대금, 아쟁, 양금, 타악기, 피리, 해금]  # = gugak_mix.classes
  target_instrument: null
  num_epochs: 60                    # 60 × 2,500 optimizer steps = 150k ceiling (spec)
  num_steps: 10000                  # loader iterations per "epoch" = 2,500 OPTIMIZER
                                    # steps at accum 4 → eval every 2,500 steps (spec)
  optimizer: adam
  lr: 1.0e-04                       # [exp002] the HTDemucs fine-tune recipe's own value
                                    # (⅓ of their from-scratch lr). exp001 ran at 5e-5
                                    # nominal / 2.5e-5 live only because of the post-cliff
                                    # resume — that halving is history, not a decision to
                                    # inherit. Launching fresh means nothing overrides it.
  patience: 5                       # ReduceLROnPlateau (scheduler, NOT early stop —
                                    # MSST HAS no early stop; the plateau stop is manual,
                                    # see the launch script's STOP POLICY)
  reduce_factor: 0.5
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0                   # OFF — MSST single-GPU path never evals/saves EMA
                                    # weights (dead overhead) → DEVIATION, see report
  other_fix: false
  use_amp: true                     # bf16 FROM LAUNCH (exp001 reached it mid-run). bf16
  amp_dtype: bfloat16               # carries fp32's exponent range in 16 bits, so the
                                    # fp16 overflow behind exp001's two cliffs is
                                    # structurally impossible; the exp001.1 probe logged
                                    # 0 non-finite steps in 40,000. GradScaler
                                    # auto-disables under bf16 (verify the AMP: line
                                    # prints grad_scaler_enabled=False); STFT/iSTFT stay
                                    # fp32-pinned in the model regardless.
  inference_amp_dtype: float32      # eval stays pure fp32 — the same measuring instrument
                                    # as exp001, so val curves remain directly comparable

# --- MSST: stock augmentations OFF — all augs live in gugak_mix ---
augmentations:
  enable: false

# --- MSST: eval-time chunked inference ---
inference:
  num_overlap: 2            # step = chunk/2 → 50% overlap (MSST integer semantics;
                            # spec's 25% is not expressible — deviation, quality ≥ spec)
  batch_size: 8

# --- MSST: model ---
model: htdemucs

gugak_mix:
  # class scheme: publisher's 9, pitched percussion (편종·편경·방향) quarantined —
  # excluded from training entirely, NOT folded back into 타악기. Order = output slots.
  classes: [가야금, 거문고, 기타, 대금, 아쟁, 양금, 타악기, 피리, 해금]

  # [exp002] manifest v2 — 16 publisher-defective rows removed (0714's three
  # mix-carrying stems + all of 0885, which is 0886 looped 7×). v1 is untouched on disk
  # as exp001's record. → docs/manifest_v2_provenance.md, configs/manifest_exclusions.yaml
  source_manifest: manifests/parquet/source_manifest_v2.parquet

  # source pool: ensemble only — 71470 solo pool parked (scope decision 2026-08-03)
  datasets: ["71955"]
  split: train

  # excerpt geometry: the checkpoint's native training length
  segment_seconds: 10.0
  sample_rate: 44100

  # [exp002] density: n uniform over 1..9 rather than drawn from the measured
  # audible-편성 distribution. We cannot justify matching real data when class IDENTITY
  # is already uniform — the realism was half-hearted either way (prof, 2026-08-03).
  # The measured path is PARKED, not deleted: set density_mode: measured to restore it.
  density_mode: uniform
  density_chunk_len_s: 10.0         # inert under uniform (measured-mode inputs, kept so
  density_coverage_threshold: 0.25  # switching modes needs no other edit)

  # live augmentations. EQ stays OFF: exp002 is the anchor later runs compare against,
  # so it must not carry an augmentation the comparison would want to isolate.
  gain_min: 0.25
  gain_max: 1.25
  channel_swap_prob: 0.5
  eq_stem_prob: 0.0
  eq_mixbus_prob: 0.0

  # mixture normalization: loudnorm mixture+targets by one shared gain to the
  # dataset-native loudness, then peak-guard
  target_lufs: -19.0
  peak_ceiling: 0.99

  # loudness_match is deliberately ABSENT — it re-levels solo-pool stems onto the
  # ensemble distribution, and there is no solo pool in this run.

  seed: 43                      # [exp002.1] THE ONE CHANGE. exp002 ran 42; this arm runs
                                # 43 on all three seed surfaces (see header). Nothing
                                # else in this file differs from exp002's config.

  # --- reserved knobs (designed, not implemented — enabling raises) ---
  coherent_mix_prob: 0.0        # coherent same-song draws + 판소리 trim rule
  multi_sample: {}              # 타악-2× seam, e.g. {타악기: 2}
  pitch_pool_manifest: null     # (source × semitone) pool table, still deferred
  draw_unit: file               # 'song_base' = summed same-base stems, reserved

# Σstem eval variant (val/test), rendered by src/data/build_sumstem_eval.py in the
# MSST-native layout (<song>/mixture.flac + <song>/<class>.flac). Classes come from
# gugak_mix.classes above — train and eval cannot drift. Lives on dataset NVMe.
# The existing render is reused unchanged: every excluded file is in the TRAIN split,
# so v1 and v2 describe the val split identically.
sumstem_eval:
  out_root: data/gugak_ensemble_71955/sumstem_9stem
  extension: flac
  subtype: PCM_24

# --- MSST: HTDemucs architecture — copied VERBATIM from the msst musdb18 template
# (configs/config_musdb18_htdemucs.yaml @ fork 65266a2). Must match the official
# pretrained checkpoint's hyperparameters or trunk weights won't transfer. ---
htdemucs:
  channels: 48
  channels_time:
  growth: 2
  num_subbands: 1
  nfft: 4096
  wiener_iters: 0
  end_iters: 0
  wiener_residual: false
  cac: true
  depth: 4
  rewrite: true
  multi_freqs: []
  multi_freqs_depth: 3
  freq_emb: 0.2
  emb_scale: 10
  emb_smooth: true
  kernel_size: 8
  stride: 4
  time_stride: 2
  context: 1
  context_enc: 0
  norm_starts: 4
  norm_groups: 4
  dconv_mode: 3
  dconv_depth: 2
  dconv_comp: 8
  dconv_init: 1e-3
  bottom_channels: 512
  t_layers: 5
  t_hidden_scale: 4.0
  t_heads: 8
  t_dropout: 0.0
  t_layer_scale: True
  t_gelu: True
  t_emb: sin
  t_max_positions: 10000
  t_max_period: 10000.0
  t_weight_pos_embed: 1.0
  t_cape_mean_normalize: True
  t_cape_augment: True
  t_cape_glob_loc_scale: [5000.0, 1.0, 1.4]
  t_sin_random_shift: 0
  t_norm_in: True
  t_norm_in_group: False
  t_group_norm: False
  t_norm_first: True
  t_norm_out: True
  t_weight_decay: 0.0
  t_lr:
  t_sparse_self_attn: False
  t_sparse_cross_attn: False
  t_mask_type: diag
  t_mask_random_seed: 42
  t_sparse_attn_window: 400
  t_global_window: 100
  t_sparsity: 0.95
  t_auto_sparsity: False
  t_cross_first: False
  rescale: 0.1
