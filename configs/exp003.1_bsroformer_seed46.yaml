# exp003.1_bsroformer_seed46.yaml — the SEED TWIN of exp003.0. One config = one wandb run
# (exp003.1_260819_bsroformer_seed46).
#
# WHY THIS RUN EXISTS. exp003.0 (BS-RoFormer pilot, seed 42) reached +10.16 dB val Σstem
# SI-SDR at ep31 with no head collapse — a single seed. The HTDemucs family (exp002 ×4
# seeds) taught us collapse outcomes are seed-BIMODAL, so one seed cannot tell "the
# model" from "the dice". This run asks that one question for BS-RoFormer (→ Notion,
# 2026-08-18 meeting note / ISMIR LBD).
#
# DERIVED FROM exp003.0 (configs/exp003.0_bsroformer_pilot.yaml). EXACTLY ONE THING
# CHANGES: the seed. It is three surfaces of one knob, and all three move 42 → 46 together:
#   1. gugak_mix.seed below                        — the incoherent-mix draw stream
#   2. --seed on the trainer          (launch.sh)  — torch/numpy global, data order
#   3. --seed on init_bsroformer_start_checkpoint.py — the fresh init of the 9 mask
#      estimators (87% of the parameters). Surface 3 needs its OWN start_checkpoint at
#      seed 46; reusing exp003.0's would leave the head init identical.
# Run-scoped strings (run_name) move with it. Everything else — model, 8 s segment,
# lr 1e-5, bf16, batch 2×16, 60-epoch cap, manifest v2, uniform density 1..9, augs,
# loss, eval cadence — is byte-identical to exp003.0. Improvements are exp003.2's job.
# All exp003.0 header notes (pilot lr guess, --use_standard_loss being load-bearing,
# batch geometry by measurement) apply unchanged and are not repeated here.
#
# ⚠️ CAVEAT, DELIBERATE, DO NOT "FIX". Moving the seed moves BOTH data order and weight
# init at once; this run measures total seed-to-seed spread, not either half.

# --- MSST: audio geometry ---
audio:
  chunk_size: 352800        # [exp003.0] 8 s × 44100 — BS-RoFormer's native training
                            # length. Divides the 441-sample STFT hop exactly (800 hops),
                            # so no ragged final frame. ALSO the eval chunk: in MSST's
                            # 'generic' inference mode (everything except htdemucs) the
                            # eval chunk is read from audio.chunk_size, not from
                            # training.segment.
  dim_f: 1024               # inert here — the model reads its own stft_* keys below
  dim_t: 801                # inert (upstream comment: "don't work (use in model)")
  hop_length: 441
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.0         # unused: our dataset does activity-aware draws itself

# --- MSST: training ---
training:
  run_name: exp003.1_260819_bsroformer_seed46       # [exp003.1] run-scoped
  custom_dataset: "src.data.mix_dataset:create_msst_dataset"   # fork hook → our loader
  batch_size: 2                     # [exp003.0] PHYSICAL, measured not guessed. Peak on
  gradient_accumulation_steps: 16   # the 96 GB card: batch 2 -> 41.7 GiB · batch 4 ->
                                    # 78.8 GiB and still creeping upward with step count
                                    # · batch 8 -> OOM. Effective batch is held at 2×16 =
                                    # 32, matching exp002, because that is what makes any
                                    # later comparison mean anything — so the physical
                                    # batch is the only free variable and 2 is the one
                                    # with real headroom. (3 would fit but cannot reach
                                    # 32 with an integer accumulation count.)
  grad_clip: 5.0                    # unchanged from exp002 (L2 norm)
  segment: 8                        # [exp003.0] bookkeeping only under 'generic' demix
  shift: 1
  samplerate: 44100
  channels: 2
  normalize: false                  # normalization owned by the dataset (−19 LUFS tuple)
  instruments: [가야금, 거문고, 기타, 대금, 아쟁, 양금, 타악기, 피리, 해금]  # = gugak_mix.classes
  target_instrument: null
  num_epochs: 60
  num_steps: 40000                  # loader iterations per "epoch" = 2,500 OPTIMIZER
                                    # steps at accum 16 → eval every 2,500 steps, per
                                    # spec. Note this also means 40,000 × 2 = 80,000
                                    # training excerpts per epoch — the same number of
                                    # items exp002 saw per epoch (10,000 × 8), so "epoch"
                                    # means the same amount of data on both arms.
                                    # Measured cost: ~2.3 loader steps/s → ~4.8 h/epoch,
                                    # so the first in-run eval is ~5 h after launch.
  optimizer: adam
  # GUESS, not tuned. Chosen conservatively for the pilot to avoid early divergence.
  # Not a considered value — do not cite this as a design decision.
  lr: 1.0e-5
  patience: 5                       # ReduceLROnPlateau (scheduler, NOT early stop —
                                    # MSST HAS no early stop; this run is stopped by hand)
  reduce_factor: 0.5
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0                   # OFF — MSST single-GPU path never evals/saves EMA
                                    # weights (dead overhead), as exp002
  other_fix: false
  use_amp: true                     # bf16 from launch. bf16 carries fp32's exponent
  amp_dtype: bfloat16               # range in 16 bits, so the fp16 overflow behind
                                    # exp001's two cliffs is structurally impossible.
                                    # GradScaler auto-disables under bf16 (verify the
                                    # AMP: line prints grad_scaler_enabled=False).
                                    # STFT/iSTFT are fp32-pinned inside the model —
                                    # for BS-RoFormer that pinning is a NEW fork patch
                                    # (models/bs_roformer/bs_roformer.py); the existing
                                    # one only covered HTDemucs.
  inference_amp_dtype: float32      # eval stays pure fp32 — same measuring instrument as
                                    # every other arm, so val curves stay comparable

# --- MSST: stock augmentations OFF — all augs live in gugak_mix ---
augmentations:
  enable: false

# --- MSST: eval-time chunked inference ---
inference:
  num_overlap: 2            # step = chunk/2 → 50% overlap. MSST's integer semantics
                            # cannot express the spec's 25%; 50% is the nearest expressible
                            # value and strictly better (deviation, quality ≥ spec — the
                            # same call exp002 made). MSST's generic path cross-fades the
                            # overlaps with a linear ramp over chunk/10.
  batch_size: 4

gugak_mix:
  # class scheme: publisher's 9, pitched percussion (편종·편경·방향) quarantined —
  # excluded from training entirely, NOT folded back into 타악기. Order = output slots,
  # and slot i is mask_estimators[i] in the model. IDENTICAL to exp002.
  classes: [가야금, 거문고, 기타, 대금, 아쟁, 양금, 타악기, 피리, 해금]

  # manifest v2 — 16 publisher-defective rows removed (0714's three mix-carrying stems +
  # all of 0885, which is 0886 looped 7×).
  source_manifest: manifests/parquet/source_manifest_v2.parquet

  # source pool: ensemble only — 71470 solo pool parked (scope decision 2026-08-03).
  # loudness_match is therefore deliberately ABSENT, as in exp002: it re-levels solo-pool
  # stems onto the ensemble distribution and there is no solo pool in this run. That is
  # also why the 8 s chunk-loudness reference did not need regenerating.
  datasets: ["71955"]
  split: train

  # [exp003.0] excerpt geometry: 8 s, BS-RoFormer's native length
  segment_seconds: 8.0
  sample_rate: 44100

  # density: n uniform over 1..9. Window-length INDEPENDENT by construction — the uniform
  # mode reads no manifest at all — so moving 10 s → 8 s needs no chunk_activities
  # regeneration. The two knobs below are measured-mode inputs, inert here, kept so
  # switching modes needs no other edit.
  density_mode: uniform
  density_chunk_len_s: 8.0
  density_coverage_threshold: 0.25

  # live augmentations, unchanged from exp002. EQ stays OFF.
  gain_min: 0.25
  gain_max: 1.25
  channel_swap_prob: 0.5
  eq_stem_prob: 0.0
  eq_mixbus_prob: 0.0

  # mixture normalization: loudnorm mixture+targets by one shared gain to the
  # dataset-native loudness, then peak-guard
  target_lufs: -19.0
  peak_ceiling: 0.99

  seed: 46                      # [exp003.1] THE ONE CHANGE. exp003.0 ran 42; this twin
                                # runs 46 on all three seed surfaces (see header).

  # --- reserved knobs (designed, not implemented — enabling raises) ---
  coherent_mix_prob: 0.0        # incoherent mixing, as exp002
  multi_sample: {}
  pitch_pool_manifest: null
  draw_unit: file

# Σstem eval variant (val), rendered by src/data/build_sumstem_eval.py in the MSST-native
# layout (<song>/mixture.flac + <song>/<class>.flac). Classes come from gugak_mix.classes
# above — train and eval cannot drift. The existing 91-song render is reused unchanged:
# it is stored at full length and chunked at eval time, so the 10 s → 8 s change does not
# touch it.
sumstem_eval:
  out_root: data/gugak_ensemble_71955/sumstem_9stem
  extension: flac
  subtype: PCM_24

# --- MSST: BS-RoFormer architecture — copied VERBATIM from the config shipped alongside
# the pretrained checkpoint (config_bs_roformer_384_8_2_485100.yaml, MSST release v1.0.12)
# with ONE change: num_stems 4 -> 9. Every other value must match the checkpoint's
# hyperparameters or the trunk weights won't transfer. Identical to the repo's
# configs/config_musdb18_bs_roformer_384_8_2_485100_sage.yaml apart from that file's added
# sage_attention key, which we do NOT enable.
#
# Note on where the parameters live: the 62 per-band mask estimators are ~24.6M params
# EACH, so going 4 -> 9 stems takes the model from 132M to 254M parameters. The shared
# trunk (band split + 8 transformer layers + final norm) is only 33.2M of that. This is
# the structural fact behind the whole experiment: in BS-RoFormer most of the capacity IS
# per-source, which is exactly what HTDemucs's shared decoder does not have.
model:
  dim: 384
  depth: 8
  stereo: true
  num_stems: 9        # [exp003.0] 4 MUSDB sources -> our 9 gugak classes
  time_transformer_depth: 1
  freq_transformer_depth: 1
  linear_transformer_depth: 0
  freqs_per_bands: !!python/tuple
