    ood: false
    num_candidates: 12
    rank_by: activity            # extreme-slow sparse sustains — surface density per window
    short_title: 김영헌의 영산회상 — 목요풍류 2015.07.16
    notes_from_listening: "상령산 at extreme slow tempo — the pure heterophony stress case. NB source is the FULL 57:49 영산회상 suite (상령산~군악), not just 상령산; credits are a TRIO (대금·거문고·해금)."

# --- Stage 2: freeze (picks made by listening, 2026-08-31) ---------------------------
# One candidate per item. Output: <storage_root>/final/<name>.wav (as-is byte copy) +
# <name>_normalised.wav (the inference-time −19 LUFS twin — what people listen to) +
# the FROZEN item manifest at out_items (pick columns added). While this section exists,
# the stage-1 path refuses to run so the frozen manifest can't be clobbered.
freeze:
  final_dir: final
  normalised_suffix: _normalised
  target_lufs: -19.0             # inference-time rule (mix_dataset._normalize)
  peak_ceiling: 0.99
  picks:                         # carried items keep their v1 picks (c01 by construction)
    sanjo_master_0253:    sanjo_master_0253_c01_0302-0332.wav
    pungnyu_master_0113:  pungnyu_master_0113_c01_0103-0133.wav
    salpuri:              salpuri_c01_2605-2635.wav
    daechwita:            daechwita_c01_0105-0135.wav
    haegeum_concerto:     haegeum_concerto_c01_0235-0305.wav
    pansori:              pansori_c01_0105-0135.wav
    monggeumpo_taryeong:  monggeumpo_taryeong_c04_5016-5046.wav
    janghanga:            janghanga_c02_5738-5808.wav
    jeongsangjigok:       jeongsangjigok_c01_3547-3617.wav
    yeongsanhoesang_hall: yeongsanhoesang_hall_c01_0055-0125.wav
    geomungo_sanjo:       geomungo_sanjo_c02_0130-0200.wav
    gayageum_sanjo:       gayageum_sanjo_c02_0350-0420.wav
    janggochum:           janggochum_c01_0030-0100.wav
    sinawi:               sinawi_c01_0030-0100.wav
    daepungnyu:           daepungnyu_c01_0020-0050.wav
    yeongsanhoesang_room: yeongsanhoesang_room_c02_0725-0755.wav
