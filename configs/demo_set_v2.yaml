  gayageum_sanjo:
    source: zTAWuGlw0z0
    tier: primary
    environment: hall
    ood: false
    num_candidates: 10
    rank_by: activity            # sparse — rank windows by audible-activity fraction
    extra_qc_flags: [VOCALISATIONS]   # 추임새 throughout; windows containing it are KEPT
    short_title: 가야금산조 서공철류 — 토요명품공연 2018.12.08
    notes_from_listening: "Sparse — activity scan matters more here than elsewhere. The drummer talks/accents (추임새) throughout. Not a disqualifier, but note it."
  janggochum:
    source: Uwuw3hsPC4A
    tier: primary
    environment: hall
    ood: false
    num_candidates: 10
    analysis: [percussion_band]  # full percussion-band energy pass alongside standard QC
    short_title: 장구춤 — 토요명품공연 2019.03.02
    notes_from_listening: "Sounds really good. The drums sound really different — brutally raw, and the hall feels less than ideally treated. Good stress test for the percussion head, which is otherwise our elite stem (+20.39)."
  sinawi:
    source: gTAK-O-ENAc
    tier: primary
    environment: hall
    ood: false
    num_candidates: 8            # source is only 5:54 — windows will overlap
    short_title: 시나위 — 국립국악원 360º VR
  daepungnyu:
    source: dzfOA-2x4_M
    tier: backup
    environment: hall
    ood: false
    num_candidates: 10
    analysis: [tone_check]       # persistent narrowband squeal reported — measure it
    short_title: 대풍류 — 토요명품공연 2015.04.04
    notes_from_listening: "There's a high-pitched squeal running under the whole track. Commenters also report the mix is badly unbalanced — 해금 and 대금 hugely exaggerated, 피리 and 아쟁 essentially inaudible. One says it's effectively a 해금 recital with your eyes closed. Keeping it, but as backup only."
  yeongsanhoesang_room:
