# configs/render/demo_v2_exp004_ep58.yaml — render job for src/render_demo.py.
# Demo set v2 (16 frozen final clips) through exp004 ep58 (val SI-SDR +6.70) — the
# best HTDemucs, partial-coherent sampling. Companion to demo_v2_exp003.0_ep59.yaml
# so the two model families A/B on identical clips.

checkpoint: experiments/exp004_260815_coherent_p1_uniform/checkpoints/model_htdemucs_ep_58_si_sdr_6.7004.ckpt
model_config: configs/exp004_htdemucs_coherent_p1_uniform.yaml
model_type: htdemucs
run_label: exp004                  # output folder: <run_label>_ep<N>/

input_glob: data/gugak_demo_set/v2/final/normalised/*_normalised.wav
clip_name_strip_suffix: _normalised

output_root: data/gugak_demo_set/v2/renders
audio:
  format: FLAC
  compression_level: 0.5
  write_mixture: true
