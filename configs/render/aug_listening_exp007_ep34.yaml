# configs/render/aug_listening_exp007_ep34.yaml — render job for src/render_demo.py.
# Augmentation listening test, stage 3b (docs/aug_listening_test_spec.md): exp007 ep34
# (augmented: exp006's recipe + EQ, capture chain, room) over every listening clip — lag-aligned master windows + in-vocabulary
# YouTube items from demo set v2 (scripts/aug_listening_cut_clips.py builds inputs/).
# Sibling job differs only in checkpoint, model config and run_label. FLAC masters; the page
# build encodes Opus.

checkpoint: experiments/exp007_260925_bsroformer_room_distance/checkpoints/model_bs_roformer_ep_34_si_sdr_10.7842.ckpt
model_config: configs/exp007_bsroformer_room_distance.yaml
model_type: bs_roformer
run_label: exp007                  # output folder: <run_label>_ep<N>/

input_glob: data/aug_listening_test/inputs/*.wav
clip_name_strip_suffix: ""

output_root: data/aug_listening_test/renders
audio:
  format: FLAC
  compression_level: 0.5
  write_mixture: false             # the page reads mixtures from inputs/
