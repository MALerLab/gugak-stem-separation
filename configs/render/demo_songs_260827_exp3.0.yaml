# configs/render/demo_songs_260827_exp3.0.yaml — render job for src/render_audio.py.
# exp003.0 FINAL checkpoint (finished 2026-08-27, ep59, val avg SI-SDR +10.70).
# Same three songs + excerpt policy as demo_songs_260810_exp3.0 so the two renders
# A/B directly (early-training ep5 vs final ep59). Personal-review demo — not the
# real-world gugak-demo-set.

checkpoint: experiments/exp003.0_260809_bsroformer_pilot/checkpoints/model_bs_roformer_ep_59_si_sdr_10.7013.ckpt
model_config: configs/exp003.0_bsroformer_pilot.yaml
model_type: bs_roformer            # MSST model key — must match the model config

val_root: data/gugak_ensemble_71955/sumstem_9stem/val
extension: flac                    # audio extension of the val tree
chunk_activities: manifests/parquet/chunk_activities.parquet

excerpt:
  seconds: 30.0                    # excerpt length (any value; ignored under full_song)
  pad_seconds: 5.0                 # separated-then-trimmed so chunking edges stay outside
  selection: most_dense
  activity_chunk_len_s: 10.0       # which window length to read from chunk_activities
  coverage_threshold: 0.25         # a class counts as audible above this window fraction
  seed: 42                         # consumed only by uniform_random

# join each stem's full-song SI-SDR (from the checkpoint's own eval history) into the CSVs
full_song_scores: true

songs:
  - song_id: 0355_민속악_산조
    note: "sparse duo texture (피리 + 타악기) — best case; A/B vs 260810 ep5 render"
  - song_id: 0076_정악_풍류음악
    note: "풍류음악 quartet — mid-density; A/B vs 260810 ep5 render"
  - song_id: 0126_정악_궁중음악
    note: "hardest: all 9 classes, heterophonic unison; A/B vs 260810 ep5 render"
