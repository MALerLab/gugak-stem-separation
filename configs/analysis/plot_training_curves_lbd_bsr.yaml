# configs/analysis/plot_training_curves_lbd_bsr.yaml — BS-RoFormer mixing recipes for the
# ISMIR 2026 LBD live Q&A deck, run by src/analysis/plot_training_curves.py:
#   uv run python -m src.analysis.plot_training_curves --config configs/analysis/plot_training_curves_lbd_bsr.yaml
# Same settings as plot_training_curves.yaml except run list, max_epoch, output and titles.
# Curves stop at epoch index 34 (= the 35-epoch budget); exp006/exp008 histories include
# their continued-to-60 epochs, which max_epoch cuts.
# Colours: high-contrast trio instead of dancheong slots 1–3 (green/blue/olive read as one
# hue). Validated 2026-11-04 with the dataviz validate_palette.js, light mode, all pairs:
# pass; aqua is 2.74:1 on the surface → relieved by the legend naming every line.
runs:
  - label: exp008 incoherent
    experiment_dir: experiments/exp008_261011_bsroformer_incoherent_n2
    config_path: configs/exp008_bsroformer_incoherent_n2.yaml
    color: "#2a78d6"               # blue
  - label: exp006 p=0.5
    experiment_dir: experiments/exp006_260925_bsroformer_partial_coherent
    config_path: configs/exp006_bsroformer_partial_coherent.yaml
    color: "#1baf7a"               # aqua
  - label: exp009 p=1
    experiment_dir: experiments/exp009_261103_bsroformer_partial_coherent_p1
    config_path: configs/exp009_bsroformer_partial_coherent_p1.yaml
    color: "#eb6834"               # orange

settings:
  metric: si_sdr
  x_axis: epoch                    # epoch | optimizer_steps
  max_epoch: 34                    # last epoch index drawn (inclusive); null = whole history
  rolling_checkpoint_glob: "last_*.ckpt"
  best_checkpoint_glob: "model_*_ep_*.ckpt"
  palette_path: configs/palette_dancheong.yaml
  output_dir: experiments/analysis/261104_lbd_bsr_curves
  figure_name: training_curves_avg_si_sdr
  title: BS-RoFormer — average validation SI-SDR per epoch
  y_label: avg val SI-SDR (dB, Σstem, 91 songs)
  panel_runs: [exp008 incoherent, exp006 p=0.5, exp009 p=1]
  per_stem_figure_name: training_curves_per_stem_si_sdr
  per_stem_title: BS-RoFormer — per-stem validation SI-SDR per epoch
  per_stem_y_label: val SI-SDR (dB, Σstem)
  per_stem_grid: [3, 3]
  per_stem_figure_size: [13.0, 10.0]
  valid_root: data/gugak_ensemble_71955/sumstem_9stem/val
  source_manifest_path: manifests/parquet/source_manifest.parquet
  per_genre_figure_name: training_curves_per_genre_si_sdr
  per_genre_title: BS-RoFormer — per-genre validation SI-SDR per epoch
  per_genre_y_label: val SI-SDR (dB, Σstem, mean over stems)
  per_genre_grid: [2, 4]
  per_genre_figure_size: [16.0, 7.5]
  x_labels: {epoch: epoch, optimizer_steps: optimizer steps}
  legend_max_columns: 4            # figure-level legends wrap beyond this many entries
  line_width: 2.0
  marker_size: 9.0
  figure_size: [11.0, 6.0]
  dpi: 160
