[project]
name = "gugak-stem-separation"
version = "0.1.0"
description = "Stem separation on a traditional Korean music (gugak) multitrack dataset (AI Hub 71955)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "soundfile",
    "tqdm",
    "matplotlib",
    "ipykernel",
    "pyloudnorm>=0.2.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "librosa>=0.11.0",
    "omegaconf>=2.3.1",
    "ml-collections>=1.1.0",
    "einops>=0.8.2",
    "openunmix>=1.3.0",
    "demucs>=4.0.1",
    "beartype==0.14.1",
    "rotary-embedding-torch==0.3.5",
    "hyper-connections==0.1.11",
    "wandb>=0.28.1",
    "soxr>=1.1.0",
    "pyyaml>=6.0.3",
    "pedalboard>=0.9.24",
    "audiomentations>=0.7.0",
    "auraloss>=0.4.0",
    "torch-log-wmse>=0.3.1",
    # scipy: already present transitively; now a DIRECT dependency of the recording-
    # condition augmentation (BSD — also the permissive alternative to Pedalboard/GPLv3)
    "scipy>=1.17.1",
]

# Application project (no build-system) -> uv manages the env, does not build the root as a package.
[tool.uv]
package = false

# PyTorch: Blackwell GPUs (RTX Pro 6000, sm_120) need the CUDA 12.8 build.
# Pin torch/torchaudio to that index; everything else resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "koreanize-matplotlib>=0.1.1",
    "nbstripout>=0.9.1",
    # pyroomacoustics (MIT): builds the RIR bank offline (scripts/build_rir_pool.py).
    # DEV-ONLY on purpose — training convolves cached WAVs and never imports it.
    "pyroomacoustics>=0.10.1",
    "pytest>=9.1.1",
]
